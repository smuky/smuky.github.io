<script>
    // Get the full query string from the URL
    const queryString = window.location.search;
    const params = new URLSearchParams(queryString);
    const fixture = params.get('fixture') || '';
    const predictor = params.get('predictor') || '';
    
    // Build the deep link path
    let deepLinkPath = 'prediction';
    if (fixture) deepLinkPath += `?fixture=${fixture}`;
    if (predictor) deepLinkPath += fixture ? `&predictor=${predictor}` : `?predictor=${predictor}`;
    
    // Android intent URL that opens app if installed, otherwise goes to Play Store
    const intentUrl = `intent://smuky.github.io/${deepLinkPath}#Intent;scheme=https;package=com.muky.toto_ai;S.browser_fallback_url=https://play.google.com/store/apps/details?id=com.muky.toto_ai;end`;
    
    // Detect if user is on Android
    const isAndroid = /Android/i.test(navigator.userAgent);
    
    if (isAndroid) {
        window.location.href = intentUrl;
    } else {
        // For non-Android devices, just go to Play Store
        window.location.href = "https://play.google.com/store/apps/details?id=com.muky.toto_ai";
    }
</script>
